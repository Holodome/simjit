limit_req_zone $binary_remote_addr zone=site_rate:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=explorer_compile_rate:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=explorer_benchmark_rate:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=explorer_conn:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=site_rate burst=20 nodelay;
    limit_conn explorer_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /explorer {
        return 301 /explorer/;
    }

    location = / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:8001/demo;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /explorer;
        proxy_set_header X-Simjit-Demo-Home /;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /demo {
        return 301 /;
    }

    location = /demo/ {
        return 301 /;
    }

    location = /explorer/demo {
        return 301 /;
    }

    location = /explorer/demo/ {
        return 301 /;
    }

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /robots.txt =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=3600" always;
        try_files /favicon.svg =404;
    }

    location = /explorer/compile {
        limit_req zone=explorer_compile_rate burst=16 nodelay;
        limit_conn explorer_conn 10;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:8001/compile;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /explorer;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /explorer/benchmark {
        limit_req zone=explorer_benchmark_rate burst=2 nodelay;
        limit_conn explorer_conn 3;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:8001/benchmark;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /explorer;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /explorer/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /explorer;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        return 404;
    }
}
